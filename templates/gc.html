<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}"  />
</head>

<body class="is-preload">

  <div id="wrapper">

    <div id="main">

      <section class="post">
       <div class="logo-title">
    <img src="{{ url_for('static', filename='images/HRlogo.png') }}" 
         alt="Harrys Racing Logo"/>

          <h1>General Classification</h1>
       </div>
       <p><br>The GC for <i><strong>{{series_name}}</strong></i>:
          </p>
		  
	   <div class="table-wrapper">
          <table class="compact-table">
             <tr>
                <th>GC Position</th>
			    <th>Rider</th>
			    <th>Gender</th>
		        <th>Nationality</th>
		        <th>Age Group</th>
		        <th>Counting Stages</th>
			    <th>Points</th>
             </tr>
             {% for item in gc_tbl %}  
             <tr>
                <td>{{item[0]}}</td>
                <td>{{item[1]}}</td>
	            <td>{{item[2]}}</td>       
	            <td>{{item[3]}}</td>       
	            <td>{{item[4]}}</td>
	            <td>{{item[5]}}</td>       
	            <td>{{item[6]}}</td>
             </tr>
            {% endfor %}
	      </table>
       </div>
	
    <p><strong><a href="{{ url_for('home') }}" class="links">Go to Home page</a></strong></p>

      </section>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/browser.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/breakpoints.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/util.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/timezone.js') }}"></script>

</body>
</html>
