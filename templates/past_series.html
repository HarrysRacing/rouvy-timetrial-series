<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Past Series</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}"  />
</head>

<body class="is-preload">

  <div id="wrapper">

    <div id="main">

      <section class="post">
       <div class="logo-title">
    <img src="{{ url_for('static', filename='images/HRlogo.png') }}" 
         alt="Harrys Racing Logo"/>

          <h1>Past Series Results</h1>
       </div>
       <p><br>Select the Series name to view the final GC and Stage results. </p>
	   <div class="table-wrapper">
          <table class="compact-table">
	      <tr>
             <th>Series Name</th>
			 <th>Start Date</th>
			 <th>End Date</th>
			 <th>Final GC</th>
			 <th>Stage Results</th>
          </tr>
          {% for item in series_tbl %}  
          <tr> 
             <td><strong>{{item[1]}}</strong></a></td>
	         <td>{{item[2]}}</td>       
	         <td>{{item[3]}}</td>   
             <td><strong><a href="{{ url_for('gc', seriesId=item[0], seriesName=item[1]) }}" class="links"> GC</a></strong></td>
             <td><strong><a href="{{ url_for('stages', seriesId=item[0], seriesName=item[1]) }}" class="links"> Stages</a></strong></td>			 
          </tr>
          {% endfor %}
	      </table>
       </div>

       <p><strong><a href="{{ url_for('home') }}" class="links">Go to Home page</a></strong></p>

      </section>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/browser.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/breakpoints.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/util.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/timezone.js') }}"></script>

</body>
</html>
